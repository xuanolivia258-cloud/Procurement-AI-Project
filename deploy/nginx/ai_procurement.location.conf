# Add these locations inside the EXISTING HTTPS server block whose
# server_name is ai4news.rnd.huawei.com. Do not create a second competing server
# block for the same host if that domain already serves other applications.
# Leave /authorize and /login/ with news; only /ai_procurement belongs to CARI.

location = /ai_procurement {
    return 301 /ai_procurement/;
}

# Keep OAuth authorization codes out of the shared gateway access log.
location = /ai_procurement/authorize {
    access_log off;
    proxy_pass http://7.184.9.192:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
}

location ^~ /ai_procurement/ {
    # The HTTPS gateway is on 10.218.163.144; the application is on 7.184.9.192.
    # No trailing slash: preserve /ai_procurement/ for the frontend container.
    proxy_pass http://7.184.9.192:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
