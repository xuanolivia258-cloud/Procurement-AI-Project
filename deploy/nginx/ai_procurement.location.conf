# Add these locations inside the EXISTING HTTPS server block whose
# server_name is cari.rnd.huawei.com. Do not create a second competing server
# block for the same host if that domain already serves other applications.

location = /ai_procurement {
    return 301 /ai_procurement/;
}

location ^~ /ai_procurement/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
