map $http_x_forwarded_proto $cari_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /ai_procurement {
    return 301 /ai_procurement/;
  }

  location /ai_procurement/api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $cari_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  # Huawei W3 redirects to this exact public path. It must reach FastAPI,
  # not the React SPA fallback below.
  location = /ai_procurement/authorize {
    # OAuth authorization codes must not be recorded in the proxy access log.
    access_log off;
    proxy_pass http://backend:8000/authorize;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $cari_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }

  location /ai_procurement/ {
    try_files $uri $uri/ /ai_procurement/index.html;
  }

  # This container serves only CARI. Other paths on the shared public domain
  # are routed by the host Nginx and must not fall through to this SPA.
  location / {
    return 404;
  }
}
