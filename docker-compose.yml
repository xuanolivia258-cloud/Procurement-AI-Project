services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/procurement.db
      AUTH_MODE: disabled
      LOCAL_ACTOR_ID: local-test-user
      LOCAL_ACTOR_NAME: Local Test User
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://apigp-kwe.huawei.com/api/idata/fin/v2/projects/project_id/getBatchRatemsRateList}
      EXCHANGE_RATE_TENANT_ID: ${EXCHANGE_RATE_TENANT_ID:-}
      EXCHANGE_RATE_RATE_TYPE: ${EXCHANGE_RATE_RATE_TYPE:-SPOT}
      EXCHANGE_RATE_TIMEOUT_SECONDS: ${EXCHANGE_RATE_TIMEOUT_SECONDS:-10}
    volumes:
      - procurement_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  procurement_data:
