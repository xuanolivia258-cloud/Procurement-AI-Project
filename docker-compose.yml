services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/procurement.db
      # Runtime switch from root .env; recreate backend/frontend after changing it.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      LOCAL_ACTOR_ID: local-test-user
      LOCAL_ACTOR_NAME: Local Test User
      INITIAL_ADMIN_IDS: ${INITIAL_ADMIN_IDS:-local-test-user}
      SITE_URL: ${SITE_URL:-http://localhost:8080/ai_procurement}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,testserver,ai4news.rnd.huawei.com,cari.rnd.huawei.com}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cari_session}
      SESSION_COOKIE_PATH: ${SESSION_COOKIE_PATH:-/ai_procurement}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      W3_CLIENT_ID: ${W3_CLIENT_ID:-}
      W3_CLIENT_SECRET: ${W3_CLIENT_SECRET:-}
      W3_AUTHORIZE_URL: ${W3_AUTHORIZE_URL:-https://uniportal.huawei.com/saaslogin1/oauth2/authorize}
      W3_ACCESS_TOKEN_URL: ${W3_ACCESS_TOKEN_URL:-https://uniportal.huawei.com/saaslogin1/oauth2/accesstoken}
      W3_REFRESH_TOKEN_URL: ${W3_REFRESH_TOKEN_URL:-https://uniportal.huawei.com/saaslogin1/oauth2/refreshtoken}
      W3_USERINFO_URL: ${W3_USERINFO_URL:-https://uniportal.huawei.com/saaslogin1/oauth2/userinfo}
      W3_LOGOUT_URL: ${W3_LOGOUT_URL:-https://uniportal.huawei.com/saaslogin1/oauth2/logout}
      W3_SCOPE: ${W3_SCOPE:-base.profile}
      W3_REDIRECT_URI: ${W3_REDIRECT_URI:-https://ai4news.rnd.huawei.com/ai_procurement/authorize}
      W3_REQUEST_TIMEOUT_SECONDS: ${W3_REQUEST_TIMEOUT_SECONDS:-10}
      W3_VERIFY_SSL: ${W3_VERIFY_SSL:-true}
      W3_DEFAULT_ROLE: ${W3_DEFAULT_ROLE:-admin}
      W3_DIRECTORY_ENABLED: ${W3_DIRECTORY_ENABLED:-true}
      W3_DIRECTORY_URL: ${W3_DIRECTORY_URL:-https://wework-digitalspace-g.rnd.huawei.com/gw/etipublicconfig/etipublicconfig/v1/w3}
      W3_DIRECTORY_TIMEOUT_SECONDS: ${W3_DIRECTORY_TIMEOUT_SECONDS:-3}
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://apig.his.huawei.com/api/idata/fin/v2/projects/com.huawei.caplatform/getBatchRatemsRateList}
      EXCHANGE_RATE_TENANT_ID: ${EXCHANGE_RATE_TENANT_ID:-}
      EXCHANGE_RATE_RATE_TYPE: ${EXCHANGE_RATE_RATE_TYPE:-SPOT-SAFE}
      EXCHANGE_RATE_TIMEOUT_SECONDS: ${EXCHANGE_RATE_TIMEOUT_SECONDS:-10}
      EXCHANGE_RATE_LOOKBACK_DAYS: ${EXCHANGE_RATE_LOOKBACK_DAYS:-7}
      EXCHANGE_RATE_CACHE_SECONDS: ${EXCHANGE_RATE_CACHE_SECONDS:-1800}
      EXCHANGE_RATE_STALE_SECONDS: ${EXCHANGE_RATE_STALE_SECONDS:-86400}
      EXCHANGE_RATE_IAM_TOKEN_CACHE_SECONDS: ${EXCHANGE_RATE_IAM_TOKEN_CACHE_SECONDS:-300}
      EXCHANGE_RATE_IAM_TOKEN_URL: ${EXCHANGE_RATE_IAM_TOKEN_URL:-https://iam.his-op.huawei.com/iam/auth/token}
      EXCHANGE_RATE_IAM_ACCOUNT: ${EXCHANGE_RATE_IAM_ACCOUNT:-}
      EXCHANGE_RATE_IAM_SECRET: ${EXCHANGE_RATE_IAM_SECRET:-}
      EXCHANGE_RATE_IAM_PROJECT_ID: ${EXCHANGE_RATE_IAM_PROJECT_ID:-}
      EXCHANGE_RATE_IAM_ENTERPRISE_ID: ${EXCHANGE_RATE_IAM_ENTERPRISE_ID:-}
      ERROR_LOG_FILE: ${ERROR_LOG_FILE:-/app/data/logs/backend-errors.log}
      ACCESS_LOG_FILE: ${ACCESS_LOG_FILE:-/app/data/logs/backend-access.log}
      OPERATION_LOG_FILE: ${OPERATION_LOG_FILE:-/app/data/logs/backend-operations.log}
      INTEGRATION_LOG_FILE: ${INTEGRATION_LOG_FILE:-/app/data/logs/backend-integrations.log}
      INTEGRATION_LOG_RESPONSE_MAX_CHARS: ${INTEGRATION_LOG_RESPONSE_MAX_CHARS:-2000}
      ERROR_LOG_MAX_BYTES: ${ERROR_LOG_MAX_BYTES:-5000000}
      ERROR_LOG_BACKUP_COUNT: ${ERROR_LOG_BACKUP_COUNT:-5}
    volumes:
      - procurement_data:/app/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"

volumes:
  procurement_data:
