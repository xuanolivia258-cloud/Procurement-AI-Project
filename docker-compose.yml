services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////app/data/procurement.db
      AUTH_MODE: disabled
      LOCAL_ACTOR_ID: local-test-user
      LOCAL_ACTOR_NAME: Local Test User
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://apig.his.huawei.com/api/idata/fin/v2/projects/com.huawei.caplatform/getBatchRatemsRateList}
      EXCHANGE_RATE_TENANT_ID: ${EXCHANGE_RATE_TENANT_ID:-}
      EXCHANGE_RATE_RATE_TYPE: ${EXCHANGE_RATE_RATE_TYPE:-SPOT-SATE}
      EXCHANGE_RATE_TIMEOUT_SECONDS: ${EXCHANGE_RATE_TIMEOUT_SECONDS:-10}
      EXCHANGE_RATE_LOOKBACK_DAYS: ${EXCHANGE_RATE_LOOKBACK_DAYS:-7}
      EXCHANGE_RATE_CACHE_SECONDS: ${EXCHANGE_RATE_CACHE_SECONDS:-1800}
      EXCHANGE_RATE_STALE_SECONDS: ${EXCHANGE_RATE_STALE_SECONDS:-86400}
      EXCHANGE_RATE_IAM_TOKEN_CACHE_SECONDS: ${EXCHANGE_RATE_IAM_TOKEN_CACHE_SECONDS:-300}
      EXCHANGE_RATE_IAM_TOKEN_URL: ${EXCHANGE_RATE_IAM_TOKEN_URL:-https://iam.his-op.huawei.com/iam/auth/token}
      EXCHANGE_RATE_IAM_ACCOUNT: ${EXCHANGE_RATE_IAM_ACCOUNT:-}
      EXCHANGE_RATE_IAM_SECRET: ${EXCHANGE_RATE_IAM_SECRET:-}
      EXCHANGE_RATE_IAM_PROJECT_ID: ${EXCHANGE_RATE_IAM_PROJECT_ID:-}
      EXCHANGE_RATE_IAM_ENTERPRISE_ID: ${EXCHANGE_RATE_IAM_ENTERPRISE_ID:-}
      ERROR_LOG_FILE: ${ERROR_LOG_FILE:-/app/data/logs/backend-errors.log}
      ACCESS_LOG_FILE: ${ACCESS_LOG_FILE:-/app/data/logs/backend-access.log}
      OPERATION_LOG_FILE: ${OPERATION_LOG_FILE:-/app/data/logs/backend-operations.log}
      INTEGRATION_LOG_FILE: ${INTEGRATION_LOG_FILE:-/app/data/logs/backend-integrations.log}
      INTEGRATION_LOG_RESPONSE_MAX_CHARS: ${INTEGRATION_LOG_RESPONSE_MAX_CHARS:-2000}
      ERROR_LOG_MAX_BYTES: ${ERROR_LOG_MAX_BYTES:-5000000}
      ERROR_LOG_BACKUP_COUNT: ${ERROR_LOG_BACKUP_COUNT:-5}
    volumes:
      - procurement_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  procurement_data:
